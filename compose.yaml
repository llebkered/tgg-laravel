services:
  app:
    build:
      context: ./docker/php
      dockerfile: Containerfile
      args:
        user: tgg
        uid: 1000
    image: localhost/tgg-app
    container_name: tgg-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "80:8080"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - tgg

  # Sends queued emails. Idle unless QUEUE_CONNECTION=database in .env.
  queue:
    image: localhost/tgg-app
    container_name: tgg-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work database --sleep=3
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - db
    networks:
      - tgg

  db:
    image: docker.io/library/mysql:8.4
    container_name: tgg-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql84:/var/lib/mysql
    networks:
      - tgg

  phpmyadmin:
    image: docker.io/library/phpmyadmin:5.2
    container_name: tgg-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - tgg

networks:
  tgg:

volumes:
  mysql84:
