version: "3.7"

services:
  app:
    build:
      args:
        user: tgg
        uid: 1000
      context: ./docker/php
      dockerfile: Dockerfile
    image: tgg
    container_name: tgg-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
    networks:
      - tgg

  db:
    # platform: linux/x86_64
    platform: linux/amd64
    image: mysql:5.7
    container_name: tgg-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - db:/var/lib/mysql
      # - ./docker/mysql:/docker-entrypoint-initdb.d
    networks:
      - tgg

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 300M
    restart: always
    ports:
      - 8081:80
    networks:
      - tgg
    volumes:
      - db:/var/lib/mysql

  # selenium:
  #   image: seleniarm/standalone-chromium
  #   volumes:
  #     - /dev/shm:/dev/shm
  #   ports:
  #     - "4444:4444"
  #     - "7900:7900"
  #   networks:
  #     - tgg


networks:
  tgg:
    driver: bridge

volumes:
  db:
    driver: local
  app:
    driver: local
